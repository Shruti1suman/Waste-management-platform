<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style2.css"> 
</head>
<body>
    <nav class="navbar">
        <div class="logo">EcoElite</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
    <header  class="text-center" style="color:white; margin-bottom: 30px; font-weight:700;">
        <h1 class="display-4">Contact Us</h1>
        <p class="lead">Get in touch with us for any queries or support.</p>
    </header>


        <!-- Contact form -->
        <form id = 'contact-form'>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
     

        <footer>
            <p>&copy; 2025 Waste Management Platform</p>
        </footer>

        <script src="script.js"></script>

</body>
</html>
